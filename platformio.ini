[platformio]
default_envs = esp32dev, wokwi

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI
  bblanchon/ArduinoJson

[env:esp32dev]
; Hardware: TFT 3.5" SPI 320x480 (ILI9488, o controlador mais comum)
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9488_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=4
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=16000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D TOUCH_CS=21
  -D TOUCH_IRQ=22
  -D TOUCH_Z_MIN=80
  -D USAGE_POLL_MS=300000

[env:wokwi]
; Wokwi só tem o componente ILI9341 240x320 — firmware só para simulação
; LDF ignora o #ifndef MOCK_USAGE e puxava WiFi; o .o some em compile paralelo.
lib_ldf_mode = chain
lib_ignore =
  HTTPClient
  WiFiClientSecure
  WiFi
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=4
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=27000000
  -D MOCK_USAGE=1
  -D BTN_PREV=13
  -D BTN_NEXT=5
