appId: com.trindadebra.vigia-ai
productName: Vigia AI
copyright: MIT — Vigia AI

directories:
  output: ../dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - "!**/*.map"

# O sidecar e o painel entram como recursos, não como código do Electron.
extraResources:
  - from: resources/sidecar
    to: sidecar
  - from: resources/collector
    to: collector
  - from: ../frontend/dist
    to: wwwroot
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png

# asar liga: o código do app fica empacotado, os recursos acima ficam fora
# (o sidecar precisa ser um arquivo executável real no disco).
asar: true

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Sem `arch:` fixo aqui de propósito: cada job da matriz do CI já passa
  # --arm64 ou --x64 na CLI (release-desktop.yml). Fixar [arm64, x64] aqui
  # fazia CADA job buildar os dois archs e colidir publicando os mesmos
  # nomes de arquivo no mesmo release (422 already_exists) quando os dois
  # rodam em paralelo (RELEASE.md). Pra build local dos dois de uma vez,
  # use `npm run dist:mac` (já passa --x64 --arm64 na CLI).
  target:
    - target: dmg
    - target: zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Sobe direto para a bandeja quando aberto pelo autostart.
    LSUIElement: false
    NSHighResolutionCapable: true

dmg:
  # ${arch} no título não é cosmético: são dois DMGs (arm64 e x64) e o
  # electron-builder monta cada um para copiar o conteúdo. Com o mesmo
  # nome, o segundo vira "Vigia AI 1.0.1 1" e o `hdiutil detach` do
  # caminho esperado falha, derrubando o build inteiro.
  title: Vigia AI ${version}${arch}
  # O auto-update do Mac baixa o .zip, não o .dmg — o blockmap do dmg
  # nunca é lido por ninguém, então não faz sentido gerá-lo.
  writeUpdateInfo: false
  contents:
    - x: 120
      y: 180
    - x: 380
      y: 180
      type: link
      path: /Applications
    # Sem certificado pago da Apple, o download vem com a flag de quarentena
    # e o Gatekeeper mostra "app danificado" mesmo sem nada quebrado — este
    # script tira só essa flag. Ver README (seção macOS) para o passo a passo.
    - x: 250
      y: 320
      type: file
      path: build/fix-gatekeeper.command

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vigia AI

linux:
  icon: build/icon.png
  category: Utility
  synopsis: Painel de cotas de IA — Claude, GPT, Cursor e outros
  description: >
    Coletor local de cotas de assinaturas de IA com painel web e suporte a um
    mostrador ESP32 na rede local. Os tokens nunca saem deste computador.
  target:
    - AppImage
    - deb
  desktop:
    entry:
      Name: Vigia AI
      Comment: Painel de cotas de IA
      Categories: Utility;Development;

publish:
  provider: github
  owner: TrindadeBRA
  repo: vigia-ai
  # Sem isso o electron-builder cria o release como rascunho — precisa de
  # alguém clicar "Publish release" na mão. Direto: publicado assim que os
  # 4 jobs da matriz terminam de subir os assets (RELEASE.md).
  releaseType: release
