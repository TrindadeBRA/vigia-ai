# Overlay opcional: monta o login do host (somente leitura).
#   docker compose -f compose.yaml -f compose.credentials.yaml up --build
#
# Keychain do macOS NÃO entra no container.

services:
  vigia:
    environment:
      CLAUDE_CREDENTIALS_PATH: /host/claude/.credentials.json
      CURSOR_STATE_DB: /host/cursor/state.vscdb
    volumes:
      - ${HOME}/.claude:/host/claude:ro
      - ${HOME}/Library/Application Support/Cursor/User/globalStorage:/host/cursor:ro
