name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build

  desktop:
    name: desktop (typecheck + sidecar)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Typecheck do Electron
        working-directory: desktop
        run: |
          npm install --ignore-scripts
          npm run typecheck

      # O handshake do sidecar é o contrato entre o coletor e o Electron
      # (desktop/src/sidecar.ts). Roda nos três SOs porque os caminhos de
      # credencial e o encerramento sem SIGTERM divergem por plataforma.
      - name: Testes do coletor (Vitest)
        working-directory: backend
        run: |
          npm install
          npm test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --user platformio
      - name: Build wokwi + esp32dev
        working-directory: firmware
        run: |
          pio run -e wokwi
          pio run -e esp32dev

  3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 3DS (host stub + citro2d check)
        run: |
          # Host stub (sem devkit) — garante que parse/state compilam no CI sem SDK
          apt-get update && apt-get install -y g++ >/dev/null 2>&1 || true
          g++ -std=c++17 -I3ds/src -I3ds/include -c 3ds/src/core/state.cpp -o /tmp/state.o
          g++ -std=c++17 -I3ds/src -I3ds/include -c 3ds/src/net/parse.cpp -o /tmp/parse.o
          g++ -std=c++17 -I3ds/src -I3ds/include -c 3ds/src/ui/theme.cpp -o /tmp/theme.o
          echo "host stub ok"
      - name: Build 3DS .3dsx (devkitARM)
        working-directory: 3ds
        run: |
          make -j$(nproc)
          ls -lh vigia-ai.elf vigia-ai.3dsx
