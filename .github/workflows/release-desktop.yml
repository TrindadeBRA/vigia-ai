name: Instaladores do app desktop

# Dispara na tag (v1.2.3) ou manualmente. Cada SO compila o próprio sidecar:
# PyInstaller não faz cross-compile.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Anexar os artefatos a um release do GitHub"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: "macOS (arm64)", args: "--mac --arm64" }
          - { os: macos-13, name: "macOS (x64)", args: "--mac --x64" }
          - { os: windows-latest, name: "Windows (x64)", args: "--win" }
          - { os: ubuntu-latest, name: "Linux (x64)", args: "--linux" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Coletor (Node bundle)
        shell: bash
        run: |
          ./scripts/build-collector.sh

      - name: Electron
        working-directory: desktop
        run: |
          npm install
          npm run build

      - name: Instalador
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assinatura + notarização no macOS. Sem os segredos, o build sai
          # sem assinar — instalável, mas o Gatekeeper reclama na 1ª abertura.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PUBLISH=never
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            PUBLISH=onTagOrDraft
          fi

          # Um secret que não existe vira variável VAZIA, não ausente. O
          # electron-builder trata CSC_LINK="" como caminho de certificado,
          # resolve para o diretório atual e morre com "desktop not a file".
          # Sem certificado o certo é não ter a variável e desligar a busca
          # por identidade — é o que acontece numa máquina local, onde ela
          # simplesmente não está definida.
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          npx electron-builder ${{ matrix.args }} \
            --config electron-builder.yml \
            --publish "$PUBLISH"

      - uses: actions/upload-artifact@v4
        with:
          name: vigia-ai-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
