services:
  collector:
    build: .
    container_name: vigia-collector
    ports:
      - "${PORT:-8787}:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      COLLECTOR_IN_DOCKER: "1"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
