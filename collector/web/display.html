<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigia AI</title>
<style>
  :root {
    --bg: #101419; --card: #192021; --card-border: #3a3d42; --track: #292d31; --chip: #212a2c;
    --text: #f7f3ef; --text-dim: #adaeb5; --text-muted: #6b6d73;
    --good: #8cbe94; --warn: #e6a65a; --bad: #de6d6b;
    --accent: #e63931; --accent-ink: #ffffff;
    --shadow: rgba(0, 0, 0, .5); --glow: rgba(230, 57, 49, .14); --bg-translucent: rgba(16, 20, 25, .82);
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-sans);
    min-height: 100vh; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important; scroll-behavior: auto !important;
    }
  }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  #root { min-height: 100vh; }
  .shell {
    min-height: 100vh; display: flex; flex-direction: column;
    background: radial-gradient(900px 320px at 50% -10%, var(--glow), transparent 60%), var(--bg);
  }
  .shell.flat { background: var(--bg); }

  .view-fade { animation: fadeIn .22s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- header ---------- */
  .header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 4px;
    height: 56px; padding: 0 10px;
    background: var(--bg-translucent); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 1px 0 var(--card-border), 0 14px 28px -22px var(--shadow);
  }
  .flat .header { background: var(--bg); backdrop-filter: none; box-shadow: 0 1px 0 var(--card-border); }
  .header .spacer { flex: 1; }
  .chevron-btn, .icon-btn {
    background: none; border: none; cursor: pointer; color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    transition: background-color .15s ease, color .15s ease;
  }
  .chevron-btn:hover, .icon-btn:hover { background: var(--chip); color: var(--text); }
  .brand-btn {
    background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 9px;
    padding: 4px 6px; border-radius: 9px; color: var(--text); font: inherit;
    transition: background-color .15s ease;
  }
  .brand-btn:hover { background: var(--chip); }
  .eye {
    width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 1px solid var(--text-dim);
    box-shadow: 0 2px 5px var(--shadow); position: relative; flex: none;
  }
  .flat .eye { box-shadow: none; }
  .eye .pupil {
    position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
    top: 50%; left: 50%; box-shadow: 0 0 7px var(--glow);
  }
  .flat .eye .pupil { box-shadow: none; }
  .eye .pupil::after { content: ""; position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; top: 20%; left: 20%; }
  .brand { font-weight: 800; letter-spacing: .2px; font-size: 15px; white-space: nowrap; }
  .brand .ai { color: var(--accent); }
  .clock-btn {
    background: none; border: none; cursor: pointer; font: inherit;
    display: flex; align-items: center; gap: 7px;
    font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap;
    padding: 7px 10px; border-radius: 9px; transition: background-color .15s ease;
  }
  .clock-btn:hover { background: var(--chip); }
  .clock-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex: none; box-shadow: 0 0 5px var(--good); }
  .flat .clock-dot { box-shadow: none; }

  .badge-ring { width: 28px; height: 28px; border-radius: 50%; padding: 3px; flex: none; margin-left: 2px; }
  .badge-inner {
    width: 100%; height: 100%; border-radius: 50%; background: var(--bg);
    display: flex; align-items: center; justify-content: center; color: var(--text); font-size: 10px; font-weight: 700;
  }
  .flat .badge-inner { background: var(--bg); }

  /* ---------- content shell ---------- */
  .content { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; }

  .status-strip {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 2px 4px 16px; font-size: 12.5px; color: var(--text-dim);
  }
  .status-strip .who { display: flex; align-items: center; gap: 7px; }
  .status-strip .who-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status-strip .who-dot.ok { background: var(--good); box-shadow: 0 0 5px var(--good); }
  .status-strip .who-dot.bad { background: var(--bad); box-shadow: 0 0 5px var(--bad); }
  .flat .status-strip .who-dot { box-shadow: none; }

  /* ---------- provider cards ---------- */
  /* Genérico: N cards (uma por conta, não por tipo de provedor) sem teto de 4. */
  .home-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .home-list { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 16px; cursor: pointer;
    box-shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 12px 26px -20px var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 18px 34px -20px var(--shadow), 0 0 0 1px var(--glow); }
  .card:active { transform: translateY(0); }
  .flat .card { box-shadow: none; }
  .flat .card:hover { transform: none; }

  .card-head { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
  .icon-chip {
    width: 36px; height: 36px; border-radius: 11px; background: var(--chip); flex: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px var(--card-border);
  }
  .icon-img { width: 20px; height: 20px; object-fit: contain; }
  .card-title-wrap { flex: 1; min-width: 0; }
  .card-title { font-weight: 650; font-size: 15px; display: flex; align-items: center; gap: 7px; min-width: 0; }
  .card-title span.txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-label {
    margin-top: 2px; font-size: 11.5px; font-weight: 500; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .status-dot.ok { background: var(--good); }
  .status-dot.bad { background: var(--bad); }
  .chev { color: var(--text-dim); flex: none; }

  .metric { margin-top: 12px; }
  .metric:first-child { margin-top: 0; }
  .metric-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 6px; }
  .metric-top .label { color: var(--text-dim); }
  .metric-top .val { font-weight: 700; font-size: 14.5px; }
  .metric-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 5px; }
  .metric-plain { font-weight: 700; font-size: 16px; }

  .bar-track { height: 7px; border-radius: 5px; background: var(--track); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .28); overflow: hidden; }
  .flat .bar-track { box-shadow: none; }
  .bar-fill { height: 100%; border-radius: 5px; min-width: 7px; background-image: linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 65%); background-blend-mode: overlay; }
  .flat .bar-fill { background-image: none; }

  .error-text { color: var(--bad); font-size: 13px; line-height: 1.55; }
  .empty-note { color: var(--text-muted); font-size: 14px; text-align: center; padding: 48px 20px; }

  /* ---------- detail views ---------- */
  .detail-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 18px; max-height: calc(100vh - 108px); overflow-y: auto;
    box-shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 12px 26px -20px var(--shadow);
  }
  .flat .detail-card { box-shadow: none; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 14px; border-bottom: 1px solid var(--track); }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--text-muted); }
  .kv .v { color: var(--text); text-align: right; font-weight: 550; }
  .note { color: var(--text-muted); font-size: 12.5px; margin: 12px 0 4px; letter-spacing: .1px; }
  .detail-bar { margin: 16px 0; }
  .detail-bar-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; margin-bottom: 8px; }
  .detail-bar-top .label { color: var(--text-dim); }
  .detail-bar-top .val { font-weight: 750; font-size: 21px; }
  .detail-bar .bar-track { height: 9px; }
  .detail-bar .metric-sub { font-size: 12.5px; margin-top: 8px; }
  .detail-plain-val { font-size: 22px; font-weight: 750; margin: 6px 0 2px; }

  /* ---------- status / settings ---------- */
  .section-title { color: var(--text-muted); font-size: 11.5px; letter-spacing: .6px; text-transform: uppercase; margin: 22px 0 9px; font-weight: 650; }
  .section-title:first-child { margin-top: 0; }
  .segmented {
    display: flex; gap: 3px; padding: 3px; background: var(--chip); border: 1px solid var(--card-border);
    border-radius: 12px;
  }
  .segmented button {
    flex: 1; padding: 9px 6px; border-radius: 9px; border: none; background: transparent;
    color: var(--text-dim); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background-color .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .segmented button:hover { color: var(--text); }
  .segmented button.active {
    background: var(--card); color: var(--accent);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 4px 10px -6px var(--shadow), inset 0 0 0 1px var(--accent);
  }
  .flat .segmented button.active { box-shadow: inset 0 0 0 1.5px var(--accent); }

  .swatch-row { display: flex; gap: 9px; flex-wrap: wrap; }
  .swatch {
    width: 34px; height: 34px; border-radius: 10px; border: 2px solid transparent; cursor: pointer;
    padding: 0; font: inherit;
    display: flex; align-items: center; justify-content: center; transition: transform .12s ease, border-color .15s ease;
  }
  .swatch:hover { transform: translateY(-1px); }
  .swatch.active { border-color: var(--text); }

  .btn-primary {
    width: 100%; padding: 13px; border-radius: 12px; border: none;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 14.5px; font-weight: 700;
    cursor: pointer; box-shadow: 0 12px 22px -12px var(--glow); transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); opacity: .9; }
  .flat .btn-primary { box-shadow: none; }
  .status-note { color: var(--text-muted); font-size: 12px; margin-top: 12px; line-height: 1.55; }
  .fetch-fail-note { color: var(--bad); font-size: 12px; margin-top: 6px; }

  /* ---------- now view (fullscreen clock) ---------- */
  .now-view {
    min-height: 100vh; width: 100%; cursor: pointer;
    background: radial-gradient(900px 420px at 50% 30%, var(--glow), transparent 65%), var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px 14px;
  }
  .now-clock {
    font-family: var(--font-mono); font-size: clamp(42px, 12vw, 66px); font-weight: 620;
    letter-spacing: -1px; font-variant-numeric: tabular-nums; text-shadow: 0 0 40px var(--glow);
  }
  .flat .now-clock { text-shadow: none; }
  .now-date { color: var(--text-dim); font-size: 14px; margin: 6px 0 26px; text-transform: capitalize; letter-spacing: .2px; }
  .now-rows { width: 100%; max-width: 480px; }
  .now-row {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 13px;
    padding: 12px 14px; margin-bottom: 9px;
    box-shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 20px -18px var(--shadow);
  }
  .flat .now-row { box-shadow: none; }
  .now-row-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  .now-row-title-wrap { min-width: 0; flex: 1; }
  .now-row-title { font-weight: 650; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now-row-metrics { display: flex; gap: 18px; }
  .now-metric { flex: 1; min-width: 0; }
  .now-metric-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
  .now-metric-top .label { color: var(--text-dim); }
  .now-metric-top .val { font-weight: 700; }
  .now-metric-plain { font-weight: 700; font-size: 13.5px; }
</style>

const POLL_MS = 60000; // igual ao poll padrao do ESP32 (USAGE_POLL_MS). Sem cache
                       // no coletor: cada aba aberta aqui soma outra chamada real
                       // as APIs, alem da placa. Ver docs/COLETOR.md.
const FETCH_OK_FLASH_MS = 1500;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function barColor(pct, pal) {
  if (pct == null || pct < 0) return pal.textMuted;
  if (pct < 70) return pal.good;
  if (pct < 90) return pal.warn;
  return pal.bad;
}
function barGlow(pct, pal) {
  if (pct == null || pct < 70) return "none";
  if (pct < 90) return `0 0 7px ${hexToRgba(pal.warn, .4)}`;
  return `0 0 10px ${hexToRgba(pal.bad, .55)}`;
}
function fmtPct(pct) { return (pct == null || pct < 0) ? "--" : Math.round(pct) + "%"; }
function fmtRemain(pct) { return (pct == null || pct < 0) ? "--" : fmtPct(100 - clamp(pct, 0, 100)); }
function fmtUsd(cents) {
  if (cents == null || cents < 0) return "--";
  if (cents === 0) return "$0.00";
  const reais = Math.trunc(cents / 100);
  const cc = Math.abs(cents % 100);
  return cc === 0 ? ("$" + reais) : ("$" + reais + "." + String(cc).padStart(2, "0"));
}
function fmtWhen(raw) {
  if (!raw) return "";
  const s = String(raw).trim();
  if (s.length >= 16 && s[4] === "-" && s[10] === "T") {
    return `${s.slice(8, 10)}/${s.slice(5, 7)} ${s.slice(11, 13)}h${s.slice(14, 16)}`;
  }
  return s;
}
function fmtClock(ms) {
  const d = new Date(ms);
  if (isNaN(d.getTime())) return "--:--";
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${a})`;
}
function inverseOn(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#000000" : "#ffffff";
}
function prefersReducedMotion() {
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
}

function usePrefs() {
  const [prefs, setPrefs] = useState(() => {
    try {
      const raw = localStorage.getItem("vigia_display_prefs");
      if (raw) return { theme: "dark", accent: 0, lang: "pt", homeLayout: "list", ...JSON.parse(raw) };
    } catch (e) {}
    return { theme: "dark", accent: 0, lang: "pt", homeLayout: "list" };
  });
  useEffect(() => {
    try { localStorage.setItem("vigia_display_prefs", JSON.stringify(prefs)); } catch (e) {}
  }, [prefs]);
  return [prefs, setPrefs];
}

function applyThemeVars(pal, accent, flat) {
  const root = document.documentElement.style;
  root.setProperty("--bg", pal.bg);
  root.setProperty("--card", pal.card);
  root.setProperty("--card-border", pal.cardBorder);
  root.setProperty("--track", pal.track);
  root.setProperty("--chip", pal.chip);
  root.setProperty("--text", pal.text);
  root.setProperty("--text-dim", pal.textDim);
  root.setProperty("--text-muted", pal.textMuted);
  root.setProperty("--good", pal.good);
  root.setProperty("--warn", pal.warn);
  root.setProperty("--bad", pal.bad);
  root.setProperty("--accent", accent);
  root.setProperty("--accent-ink", inverseOn(accent));
  root.setProperty("--shadow", pal.shadow);
  root.setProperty("--glow", flat ? "rgba(0,0,0,0)" : hexToRgba(accent, .16));
  root.setProperty("--bg-translucent", hexToRgba(pal.bg, flat ? 1 : .82));
}

function Svg({ d, size, viewBox, stroke, fill, className, children }) {
  return h("svg", {
    width: size || 16, height: size || 16, viewBox: viewBox || "0 0 24 24", className,
    fill: fill || "none", xmlns: "http://www.w3.org/2000/svg", "aria-hidden": "true",
  }, children || (d ? h("path", { d, stroke: stroke || "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" }) : null));
}
function ChevronLeft(props) { return h(Svg, { ...props, d: "M15 6l-6 6 6 6" }); }
function ChevronRight(props) { return h(Svg, { ...props, d: "M9 6l6 6-6 6" }); }
function CheckIcon(props) { return h(Svg, { ...props, d: "M5 13l4 4L19 7" }); }

    h("circle", { cx: 12, cy: 8.2, r: 1.15, fill: "currentColor" }),
    h("path", { d: "M12 11v5.2", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round" }));
}

function Eye({ size }) {
  const ref = useRef(null);
  useEffect(() => {
    if (prefersReducedMotion()) return;
    let raf = null;
    let target = { x: 0, y: 0 };
    let gaze = { x: 0, y: 0 };
    let nextMoveAt = 0;
    const maxGaze = Math.max(1, size * 0.6 / 2 - 2);
    function tick(now) {
      if (now >= nextMoveAt) {
        target.x = (Math.random() * 2 - 1) * maxGaze;
        target.y = (Math.random() * 2 - 1) * maxGaze;
        nextMoveAt = now + 900 + Math.random() * 1700;
      }
      gaze.x += (target.x - gaze.x) * 0.08;
      gaze.y += (target.y - gaze.y) * 0.08;
      if (ref.current) {
        ref.current.style.transform = `translate(calc(-50% + ${gaze.x}px), calc(-50% + ${gaze.y}px))`;
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [size]);
  return h("div", { className: "eye", style: { width: size, height: size } },
    h("div", { className: "pupil", ref }));
}

function Badge({ secs, total, showCheck, pal }) {

  return h("div", { className: "badge-ring", style: { background: `conic-gradient(${ringColor} ${pct}%, var(--track) 0)` } },

}

// Monta os dados de cada provedor configurado uma vez só; Home (cards) e
// NowView (linhas compactas da tela cheia do relogio) renderizam o mesmo
// array de forma diferente — igual ao firmware, que reusa os mesmos campos
// em paintHome*/paintNow.
function buildProviders(data, t) {
  const list = [];
  for (const c of data.claude || []) {
    list.push({
      id: "claude:" + c.id, provider: "claude", ok: c.ok, error: c.error,
      title: "Claude", label: c.label || "",
      metrics: [
        { label: t.session5h, pct: c.session_percent,
          sub: c.session_percent != null ? (t.remainingPrefix + fmtRemain(c.session_percent) + (c.session_resets_at ? "  ·  " + t.resetPrefix + fmtWhen(c.session_resets_at) : "")) : null },
        { label: t.weekLimit, pct: c.weekly_percent,
          sub: c.weekly_percent != null ? (t.remainingPrefix + fmtRemain(c.weekly_percent) + (c.weekly_resets_at ? "  ·  " + t.resetPrefix + fmtWhen(c.weekly_resets_at) : "")) : null },
      ],
    });
  }
  for (const c of data.cursor || []) {
    let ondemand = "";
    if (c.used_cents != null && c.limit_cents != null) ondemand = fmtUsd(c.used_cents) + " / " + fmtUsd(c.limit_cents);
    if (c.bonus_cents > 0) ondemand += (ondemand ? "  " : "") + t.bonusPrefix + fmtUsd(c.bonus_cents);
    const base = c.plan ? `Cursor ${c.plan}` : "Cursor";
    list.push({
      id: "cursor:" + c.id, provider: "cursor", ok: c.ok, error: c.error,
      title: base, label: c.label || "",
      metrics: [
        { label: t.cursorModels, pct: c.percent, sub: c.cycle_end ? (t.resetPrefix + fmtWhen(c.cycle_end)) : null },
        { label: t.otherModels, pct: c.other_percent, sub: ondemand || null },
      ],
    });
  }
  for (const o of data.openrouter || []) {
    const sub = o.limit_cents != null
      ? (t.remainMoney + fmtUsd(o.remaining_cents) + "  " + fmtUsd(o.used_cents) + t.ofSep + fmtUsd(o.limit_cents))
      : t.noCredits;
    list.push({
      id: "openrouter:" + o.id, provider: "openrouter", ok: o.ok, error: o.error,
      title: "OpenRouter", label: o.label || "",
      metrics: [{ label: t.accountCredits, pct: o.percent, sub }],
    });
  }
  for (const d of data.deepseek || []) {
    const sub = d.remaining_cents != null ? (t.remainMoney + fmtUsd(d.remaining_cents)) : t.noCredits;
    list.push({
      id: "deepseek:" + d.id, provider: "deepseek", ok: d.ok, error: d.error,
      title: "DeepSeek", label: d.label || "",
      metrics: [{ label: t.accountCredits, pct: d.percent, sub }],
    });
  }
  return list;
}

function App() {
  const [prefs, setPrefs] = usePrefs();
  const [data, setData] = useState(null);
  const [view, setView] = useState("home");
  const [nextFetchAt, setNextFetchAt] = useState(Date.now() + POLL_MS);
  const [okFlashAt, setOkFlashAt] = useState(0);
  const [now, setNow] = useState(Date.now());
  const [driftMs, setDriftMs] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const [fetchFailed, setFetchFailed] = useState(false);

  const pal = PALETTES[prefs.theme];
  const flat = prefs.theme === "contrast";
  const accent = ACCENTS[prefs.theme][prefs.accent] || ACCENTS[prefs.theme][0];
  const t = STR[prefs.lang];
  const shellClass = "shell" + (flat ? " flat" : "");

  useEffect(() => { applyThemeVars(pal, accent, flat); }, [prefs.theme, prefs.accent]);

  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  async function fetchUsage() {
    setRefreshing(true);
    try {
      const res = await fetch("/usage", { cache: "no-store" });
      const json = await res.json();
      setData(json);
      setFetchFailed(false);
      setOkFlashAt(Date.now());
      const serverMs = Date.parse(json.updated_at);
      if (!isNaN(serverMs)) setDriftMs(serverMs - Date.now());
    } catch (e) {
      setFetchFailed(true);
    } finally {
      setRefreshing(false);
      setNextFetchAt(Date.now() + POLL_MS);
    }
  }

  useEffect(() => {
    fetchUsage();
    const id = setInterval(fetchUsage, POLL_MS);
    return () => clearInterval(id);
  }, []);

  // Se a conta aberta no detalhe sumir (removida no painel, ou coletor
  // reiniciado sem ela) entre um refresh e outro, volta pra Início.
  useEffect(() => {
    if (!data || view === "home" || view === "status" || view === "now") return;
    const idx = view.indexOf(":");
    if (idx <= 0) {
      setView("home");
      return;
    }
    const provider = view.slice(0, idx);
    const accountId = view.slice(idx + 1);
    const list = data[provider] || [];
    if (!list.some((a) => a.id === accountId)) setView("home");
  }, [data, view]);

  if (!data) {
    return h("div", { className: shellClass },
      h("div", { className: "header" },
        h("div", { className: "eye", style: { width: 30, height: 30 } }, h("div", { className: "pupil" })),
        h("div", { className: "brand" }, "VIGIA", h("span", { className: "ai" }, " AI"))),
      h("div", { className: "content" },
        h("div", { className: "empty-note" }, fetchFailed ? t.fetchFail : "…")));
  }

  if (view === "now") {
    return h("div", { className: shellClass }, h(NowView, { data, prefs, t, pal, nowMs: now, okFlashAt, onClose: () => setView("home") }));
  }

  const showCheck = okFlashAt && (now - okFlashAt < FETCH_OK_FLASH_MS);
  const secsLeft = showCheck ? null : Math.max(0, Math.ceil((nextFetchAt - now) / 1000));

  const detailComponents = {
    claude: ClaudeDetail, cursor: CursorDetail, openrouter: OpenRouterDetail, deepseek: DeepSeekDetail,
  };
  const isHome = view === "home";
  const isStatus = view === "status";
  let DetailComp = null;
  let detailAccount = null;
  if (!isHome && !isStatus) {
    const idx = view.indexOf(":");
    if (idx > 0) {
      const provider = view.slice(0, idx);
      const accountId = view.slice(idx + 1);
      detailAccount = (data[provider] || []).find((a) => a.id === accountId) || null;
      DetailComp = detailComponents[provider] || null;
    }
  }

  return h("div", { className: shellClass },
    h("div", { className: "header" },
      !isHome ? h("button", { className: "chevron-btn", onClick: () => setView("home"), title: t.back }, h(ChevronLeft, { size: 19 })) : null,
      h("button", { className: "brand-btn", onClick: () => setView("home") },
        h(Eye, { size: 30 }),
        h("div", { className: "brand" }, "VIGIA", h("span", { className: "ai" }, " AI"))),
      h("div", { className: "spacer" }),
      h("button", { className: "clock-btn num", onClick: () => setView("now"), title: t.now },
        h("span", { className: "clock-dot" }), fmtClock(now + driftMs)),
      h("button", { className: "icon-btn", onClick: () => setView("status"), title: t.info,
        style: { color: isStatus ? "var(--accent)" : "var(--text-dim)" } }, h(InfoIcon, { size: 20 })),
      h(Badge, { secs: secsLeft, total: POLL_MS / 1000, showCheck, pal })),
    h("div", { className: "content view-fade", key: view },
      isHome ? h(Home, { data, prefs, t, pal, now, okFlashAt, onOpen: setView }) : null,
      isStatus ? h(StatusView, { prefs, setPrefs, t, onRefresh: fetchUsage, data, refreshing, fetchFailed }) : null,
      (DetailComp && detailAccount) ? h(DetailComp, { data, account: detailAccount, t, pal }) : null));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
