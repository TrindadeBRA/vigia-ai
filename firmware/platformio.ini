[platformio]
default_envs = esp32dev, wokwi

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; huge_app.csv: mineração (Stratum + SHA256 + STL) empurrou o firmware pra
; 97% do particionamento padrão (~1,31MB de app) — sem OTA (não usado neste
; projeto), dá ~3MB pro app. NerdMiner_v2 documenta a mesma exigência
; ("partition scheme should be build as huge app"). Troca de partição pede
; "Erase Flash"/apagar tudo no próximo flash de uma placa já gravada com o
; esquema antigo (senão o offset da SPIFFS/LittleFS do tema muda e o
; conteúdo antigo fica ilegível) — ver .agents/PLANO_MINERACAO.md.
board_build.partitions = huge_app.csv
; src/ é compilado em árvore (core/, net/, input/, ui/). Includes: "ui/ui.h".
lib_deps =
  bodmer/TFT_eSPI
  bblanchon/ArduinoJson
  ricmoo/QRCode

[env:esp32dev]
; Hardware: placa integrada ESP32+TFT 3.5" ILI9488, modelo "ESP32-2432024"
; (Shenzhen Changcai Intelligent) — pinout de fabrica confirmado no
; esquematico do fornecedor, diferente do wiring solto documentado em
; HARDWARE.md. TFT_RST vai no reset geral (sem GPIO dedicado); backlight
; via MOSFET no IO27. Touch (4 fios resistivo, X+/Y-/X-/Y+) ainda nao
; ajustado aqui.
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9488_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=27
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=16000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D TOUCH_CS=33
  -D TOUCH_Z_MIN=500
  -D TFT_ROTATION=1
  -D USAGE_POLL_MS=60000

[env:wokwi]
; Wokwi: so existe ILI9341 240x320 (nao ha ILI9488 3,5" 320x480 no simulador)
; peca rotate 90 + setRotation 1 = paisagem 320x240, mesma orientacao da placa real
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=4
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  -D SPI_FREQUENCY=27000000
  -D WOKWI_SIM=1
  -D TFT_ROTATION=1
  -D USAGE_POLL_MS=60000
  -D BTN_PREV=13
  -D BTN_NEXT=5
